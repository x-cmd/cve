name: release-xz

# Producer pipeline for https://github.com/x-cmd/cve — keeps the
# per-year CVE TSV data and the matching release assets in sync with
# upstream CVEProject/cvelistV5.
#
# The pipeline runs in three steps, matching the daily schedule:
#
#   1. REBUILD + COMMIT DATA
#      Pull upstream cvelistV5, run `tsv.py --rebuild` to write
#      fresh data/cve-YYYY.tsv, then `git commit` + `git push` so
#      the source-of-truth lives in git history (one commit per
#      CI run that actually saw upstream churn).
#
#   2. DIFF VS LAST RELEASE ASSET
#      Download the previous `cve-all.tar.xz` from the `data`
#      release into a temp dir, then compare each year-by-year
#      against the freshly-built data/cve-YYYY.tsv. The release
#      asset — not a git tag — is the comparison source because
#      the asset is what consumers actually see, so a byte-level
#      diff against it is the most honest signal for "do consumers
#      need to refresh?". Any year whose bytes differ is added to
#      `changed.txt`.
#
#   3. CONDITIONALLY REPACK + UPLOAD
#      For each year in `changed.txt`, xz-compress + re-upload the
#      per-year .xz asset. ALSO re-pack `cve-all.tar.xz` and
#      re-upload — but ONLY if at least one year changed. If
#      nothing changed, leave the existing bundle alone (its
#      sha256 is what consumers have cached, and re-uploading the
#      same bytes would invalidate their cache for no reason).
#
# Schedule: every 4h, off-the-hour (`37 */4 * * *`).
#
# Repo layout:
#   .x-cmd/tsv.py, cwe.py, cwe_report.py, report.py
#                                       ← scripts (this dir)
#   data/cve-YYYY.tsv                   ← per-year TSVs, tracked
#   data/cwe.tsv, data/cwe.slim.tsv     ← MITRE CWE catalog, tracked
#   data/index.tsv                      ← manifest, NOT tracked (.gitignore)
#   data/cve.tsv.state.json             ← rebuild cache, NOT tracked (.gitignore)
#
# NB: NO .xz files are committed to the main branch — binaries belong
# in release assets, not source. data/cve-*.tsv IS tracked and IS
# committed on every CI run that sees changes, so the upstream
# dataset is reproducible from git alone.

on:
  schedule:
    - cron: "37 */4 * * *"   # every 4h, 17min past the hour; off-the-hour to spread load
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-xz
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so commits land cleanly on main.
          fetch-depth: 0

      - name: Install xz
        run: |
          command -v xz && xz --version
          # xz-utils is preinstalled on ubuntu-latest; this is just a guard.

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =================================================================
      # STEP 1 — Rebuild per-year TSVs from upstream cvelistV5 and
      # commit + push the result so git history mirrors what consumers
      # see. Idempotent: when the rebuild produces no diff against
      # HEAD (no upstream churn today) the commit step exits cleanly
      # without making an empty commit.
      # =================================================================
      - name: Build TSVs from upstream cvelistV5
        # Shallow clone of cvelistV5 (--depth 1) is enough — we only
        # need HEAD, not history. Runs `tsv.py --rebuild` against
        # the local clone to write fresh data/cve-YYYY.tsv.
        run: |
          mkdir -p data
          git clone --depth 1 https://github.com/CVEProject/cvelistV5.git \
              /tmp/cvelistV5 2>&1 | tail -3
          python3 .x-cmd/tsv.py \
              --src /tmp/cvelistV5/cves \
              --out data \
              --rebuild 2>&1 | tail -5
          rm -rf /tmp/cvelistV5

      - name: Commit refreshed data/
        # Commit only the per-year TSVs that actually changed against
        # HEAD. `git add data/cve-*.tsv` matches all years (1999..2099
        # range) but `git diff --cached --quiet` short-circuits when
        # nothing changed, so a no-op day produces no commit. The
        # cwe.tsv catalog lives in a separate commit (see below).
        run: |
          git add data/cve-*.tsv
          if git diff --cached --quiet; then
              echo "no per-year TSV changes — skipping data commit"
              exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "data: refresh cve-*.tsv ($(date -u +%Y-%m-%d))"
          git push

      # =================================================================
      # STEP 2 — Diff freshly-built data/ against the previous
      # cve-all.tar.xz from the `data` release. The release asset is
      # the source of truth for consumers, so comparing against IT
      # (rather than a git tag) answers the right question: "do
      # consumers need a fresh download?".
      # =================================================================
      - name: Fetch previous cve-all.tar.xz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/prev_data
          rm -f /tmp/prev_data/*.tsv
          if gh release view data >/dev/null 2>&1; then
              echo "Fetching previous cve-all.tar.xz from release..."
              if curl -fsSL -o /tmp/prev_all.tar.xz \
                  https://github.com/x-cmd/cve/releases/download/data/cve-all.tar.xz; then
                  tar -xJ -C /tmp/prev_data -f /tmp/prev_all.tar.xz
                  n=$(ls /tmp/prev_data/ 2>/dev/null | wc -l | tr -d ' ')
                  echo "Extracted ${n} files from previous release"
              else
                  echo "cve-all.tar.xz fetch failed — treating as first run"
              fi
          else
              echo "No 'data' release yet — treating as first run"
          fi

      - name: Detect changed TSV files (vs previous release)
        id: changed
        run: |
          # Compare every shipped TSV (per-year CVE files + the
          # MITRE CWE catalog) byte-for-byte against the previous
          # release. A missing previous file (new year, or first run)
          # is treated as a change. The output `changed.txt` lists
          # the basenames whose .xz asset needs re-uploading; if
          # it's empty we also skip the cve-all.tar.xz rebuild (Step
          # 3) and skip every upload step.
          #
          # We package four kinds of files:
          #   data/cve-YYYY.tsv    ← per-year CVE rows
          #   data/cwe.tsv         ← full MITRE catalog (rare changes)
          #   data/cwe.slim.tsv    ← slim subset, used in x cwe
          # `index.tsv` and `cve.tsv.state.json` stay local — no
          # consumer fetches them from the release.
          : > changed.txt
          for f in data/cve-*.tsv data/cwe.tsv data/cwe.slim.tsv; do
              [ -f "$f" ] || continue
              base=$(basename "$f")
              prev="/tmp/prev_data/$base"
              if [ ! -f "$prev" ] || ! cmp -s "$f" "$prev"; then
                  echo "$base" >> changed.txt
              fi
          done
          count=$(wc -l < changed.txt | tr -d ' ')
          echo "Files changed vs previous release:"
          if [ -s changed.txt ]; then
              cat changed.txt
          else
              echo "(none)"
          fi
          echo "changed_count=${count}" >> "$GITHUB_OUTPUT"

      # =================================================================
      # STEP 3 — Conditionally rebuild release assets:
      #   * per-year .xz for every year in changed.txt
      #   * cve-all.tar.xz ONLY if anything changed (skip when zero
      #     so consumers' cached sha256 stays valid for no-op days)
      # =================================================================
      - name: Compress changed per-year TSVs
        if: steps.changed.outputs.changed_count != '0'
        # xz -9 = best compression; per-year TSV shrinks ~85%.
        # -k keeps the .tsv on disk so the workflow doesn't accidentally
        # delete source files.
        run: |
          mkdir -p release
          while IFS= read -r f; do
              [ -f "data/$f" ] || continue
              xz -9 -k -c "data/$f" > "release/${f}.xz"
          done < changed.txt
          echo "--- compressed per-year ---"
          ls -lh release/

      - name: Build cve-all.tar.xz
        if: steps.changed.outputs.changed_count != '0'
        run: |
          mkdir -p release
          # Tar every data/cve-*.tsv into a plain tar, then xz it.
          # We have to expand the glob BEFORE tar changes directory
          # (otherwise `cve-*.tsv` resolves against the post-`-C`
          # directory and finds nothing). Pass the explicit list of
          # absolute paths to tar, which it then strips via the -C.
          tar -C data -cf - $(cd data && echo cve-*.tsv) | xz -9 -e > release/cve-all.tar.xz
          ls -lh release/cve-all.tar.xz

      # =================================================================
      # Reports — derived from the freshly-built data/. The cwe.tsv
      # catalog is rebuilt too (cwe.py fetches MITRE's 2000.csv.zip
      # with a 30-day TTL) so the cve/cwe cross-reference reports
      # are emitted from the latest inputs.
      # =================================================================
      - name: Generate CWE catalog TSV
        run: python3 .x-cmd/cwe.py

      - name: Generate CWE cross-reference report
        run: |
          python3 .x-cmd/cwe_report.py

      - name: Generate year stats report
        run: python3 .x-cmd/report.py

      - name: Inline reports into README + README.cn
        # Stitch both report/cve.report.md (per-year stats) and
        # report/cwe.report.md (top-10 CWE rankings) into README.md
        # AND README.cn.md (Chinese translation). Stitch order matters:
        # cwe first (lands just before the anchor, position #2), then
        # cve (lands between cwe and the anchor, position #3 with its
        # own ## heading). Each block is wrapped in BEGIN/END markers
        # so the step is idempotent and survives a partial re-run.
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # The "Data as of: YYYY-MM-DD" line at the top of each README
          # must match the "截至 YYYY-MM-DD" YTD label that report.py
          # embeds in the per-year stats table. We extract the date
          # from report/cve.report.md (just emitted by report.py in
          # the previous step) so the two labels are guaranteed to
          # match — using datetime.date.today() here would risk
          # drifting by a day if the workflow re-runs the inline
          # step without re-running report.py.
          cve_report = Path("report/cve.report.md").read_text(encoding="utf-8")
          date_match = re.search(
              r"(\d{4}) _\(YTD as of (\d{4}-\d{2}-\d{2})\)_", cve_report
          )
          if not date_match:
              raise SystemExit(
                  "ERROR: could not find YTD 'as of' date in report/cve.report.md"
                  " — has report.py's TODAY_ISO format changed?"
              )
          YTD_YEAR, DATA_AS_OF = date_match.groups()

          # Per-language "data as of" line. Each README has a
          # `<!-- cve-data-as-of:START --> ... <!-- cve-data-as-of:END -->`
          # block at the top; we replace the body with the localized
          # timestamp line. Idempotent — running the workflow twice
          # on the same day produces no diff.
          DATE_LINES = {
              Path("README.md"):
                  f"**Data as of: {DATA_AS_OF}** _(refreshed daily from "
                  f"upstream cvelistV5 — pull this page tomorrow and the "
                  f"rankings will have moved)._",
              Path("README.cn.md"):
                  f"**数据截至：{DATA_AS_OF}** _（每日从上游 cvelistV5 更新 "
                  f"—— 明天再看，榜单就会有变化）。_",
          }

          # Both blocks share one anchor — they stack at the same
          # insertion point in the order they're called below. Insert
          # before the `## Reports` heading so the inlined content
          # leads the page and the Reports link table follows.
          ANCHOR = "## Reports"

          # Per-file intros — the cve block carries a ## heading (the
          # "story" title), the cwe block has no intro at all (the H1
          # tagline at the top of the README already covers the
          # "refreshed daily" promise, and the cwe block content
          # speaks for itself). This keeps the front-matter tight:
          # H1 tagline → cwe tables → cve section → Reports link table.
          INTRO_CVE = {
              Path("README.md"): (
                  "## How fast is CVE growing?\n\n"
                  "_Per-year CVE volume and severity._"
              ),
              Path("README.cn.md"): (
                  "## CVE 增长得有多快？\n\n"
                  "_逐年 CVE 数量与严重程度。_"
              ),
          }
          # INTRO_CWE intentionally empty — the H1 tagline under
          # `# What CVEs keep teaching us` is the single source of
          # the "refreshed daily" promise. Repeating it at the top
          # of every block was duplication. To restore the line, just
          # populate INTRO_CWE[Path(...)] = "..." with the desired
          # first line of the cwe block. (Must be defined so the
          # inline loop's INTRO_CWE[readme_path] lookup doesn't
          # NameError.)
          INTRO_CWE = {
              Path("README.md"): "",
              Path("README.cn.md"): "",
          }

          # Chinese localizations applied to README.cn.md AFTER the
          # English blocks have been stitched in. The CWE data
          # (cwe.report.md) is English-only by design (MITRE names are
          # technical terms); we only localize the framing prose —
          # the question headings, their subtitles, and the headline
          # numbers line (which uses numbers that change every run,
          # so it's a regex).
          ZH_REPLACEMENTS = [
              (
                  re.compile(r"_([\d,]+) CVEs across ([\d,]+) distinct CWEs since (\d{4})\._"),
                  r"自 \3 年以来，共 \1 个 CVE，涉及 \2 个不同的 CWE。",
              ),
              (
                  "### What mistake do engineers keep making most often since 2024?",
                  "### 2024 年以来，工程师们最常犯的错误是什么？",
              ),
              (
                  "_Top 10 CWE by CVE count._",
                  "_Top 10 CWE by CVE count —— 按 CVE 数量排序的前 10。_",
              ),
              (
                  "### When that mistake is made, how bad is it since 2024?",
                  "### 2024 年以来，犯下这些错误后果有多严重？",
              ),
              (
                  "_Top 10 CWE by average CVSS score. Min 10 CVEs to suppress single-CWE outliers._",
                  "_Top 10 CWE by average CVSS score —— 至少 10 个 CVE 以避免单个 CWE 极端值的影响。_",
              ),
              # YTD annotation on the current-year row in the per-year
              # stats table. The label uses today's ISO date so it
              # stays accurate without further code changes.
              (
                  re.compile(r"(\d{4}) _\(YTD as of (\d{4}-\d{2}-\d{2})\)_"),
                  r"\1 _（截至 \2）_",
              ),
          ]

          def stitch(readme: str, md_path: Path, begin: str, end: str,
                     intro: str) -> str:
              body = md_path.read_text(encoding="utf-8").rstrip() + "\n"
              # If `intro` is empty, the block starts directly with the
              # BEGIN marker + body (no extra attribution line).
              # Otherwise intro sits between BEGIN and body as a
              # short attribution paragraph.
              if intro:
                  block = f"{begin}\n\n{intro}\n\n{body}{end}\n"
              else:
                  block = f"{begin}\n\n{body}{end}\n"
              if begin in readme and end in readme:
                  # Replace in place. Strip trailing blank lines from
                  # the surrounding tail so successive runs don't pile
                  # up padding — we keep exactly one trailing \n after
                  # the END marker and let the original blank-line
                  # padding on either side flow through naturally.
                  i = readme.index(begin)
                  j = readme.index(end) + len(end)
                  tail = readme[j:].lstrip("\n")
                  return readme[:i] + block + "\n" + tail
              # First insert: block + blank line before the anchor.
              return readme.replace(ANCHOR, block + "\n\n" + ANCHOR, 1)

          for readme_path in (Path("README.md"), Path("README.cn.md")):
              if not readme_path.is_file():
                  print(f"skip: {readme_path} does not exist yet")
                  continue
              text = readme_path.read_text(encoding="utf-8")
              # Refresh the "Data as of: YYYY-MM-DD" / "数据截至：YYYY-MM-DD"
              # timestamp at the top of each README. The block lives
              # between <!-- cve-data-as-of:START --> and ...:END -->,
              # which we replace with the localized line for today.
              date_start = "<!-- cve-data-as-of:START -->"
              date_end = "<!-- cve-data-as-of:END -->"
              if date_start in text and date_end in text:
                  i = text.index(date_start)
                  j = text.index(date_end) + len(date_end)
                  text = text[:i] + date_start + "\n" + DATE_LINES[readme_path] + "\n" + date_end + text[j:]
              # Stitch cwe FIRST so it lands in position #2 (no ## heading),
              # then stitch cve so it lands in position #3 with its own
              # `## CVE growth trend` (or `## CVE 增长趋势`) heading.
              text = stitch(
                  text,
                  Path("report/cwe.report.md"),
                  "<!-- BEGIN cwe.report.md -->",
                  "<!-- END cwe.report.md -->",
                  INTRO_CWE[readme_path],
              )
              text = stitch(
                  text,
                  Path("report/cve.report.md"),
                  "<!-- BEGIN cve.report.md -->",
                  "<!-- END cve.report.md -->",
                  INTRO_CVE[readme_path],
              )
              # Chinese-only pass: replace the English framing prose
              # with Chinese so README.cn.md reads naturally. Done
              # AFTER the English blocks have been stitched in so the
              # regex matches the exact English text emitted by
              # cwe_report.py.
              if readme_path.name == "README.cn.md":
                  for pattern, replacement in ZH_REPLACEMENTS:
                      text = pattern.sub(replacement, text) \
                          if hasattr(pattern, "sub") \
                          else text.replace(pattern, replacement)
              readme_path.write_text(text, encoding="utf-8")
              print(f"inlined report/cwe.report.md and report/cve.report.md into {readme_path}")
          PY
          git diff --stat README.md README.cn.md || true

      - name: Commit regenerated reports + README
        # Skip when nothing changed — keeps the commit graph clean on
        # days where the upstream cvelistV5 returned no new CVEs.
        run: |
          git add \
              README.md \
              README.cn.md \
              report/README.md \
              report/cve.report.md \
              report/cve.report.tsv \
              report/cwe.report.md \
              report/cwe.top100.by-cve-count.report.tsv \
              report/cwe.top100.by-cve-score.report.tsv \
              report/cwe.top100.by-cve-count.since-2024.report.tsv \
              report/cwe.top100.by-cve-score.since-2024.report.tsv
          if git diff --cached --quiet; then
              echo "no report/README changes — skipping commit"
              exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Data freshness stamp pulled from the freshly-stitched README
          # so the commit message reflects *what* changed (data date)
          # not *when* the runner happened to wake up.
          data_date="$(grep -oE '20[0-9]{2}-[0-9]{2}-[0-9]{2}' \
              README.md | head -1)"
          git commit -m "data: refresh cve/cwe reports + inlined README (data ${data_date})"
          git push

      # =================================================================
      # STEP 3 (cont.) — Upload the rebuilt assets to the `data`
      # release. Skip every upload step when nothing changed, so
      # consumers' cached sha256s stay valid for no-op days.
      # =================================================================
      - name: Ensure 'data' release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view data >/dev/null 2>&1; then
              echo "Creating 'data' release (first run)..."
              gh release create data \
                  --title "data" \
                  --notes "xz-compressed CVE index (auto-generated daily)." \
                  --draft
              # Release starts as draft; assets added below; we publish
              # at the very end so consumers never see a half-built
              # release.
          fi

      - name: Upload changed per-year .xz assets
        if: steps.changed.outputs.changed_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while IFS= read -r f; do
              [ -f "release/${f}.xz" ] || continue
              # Delete existing asset (if any) so the upload replaces it.
              gh release delete-asset data "${f}.xz" --yes 2>/dev/null || true
              echo "Uploading ${f}.xz"
              gh release upload data "release/${f}.xz" --clobber
          done < changed.txt

      - name: Upload cve-all.tar.xz
        if: steps.changed.outputs.changed_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f release/cve-all.tar.xz ] || {
              echo "release/cve-all.tar.xz missing — skipping"
              exit 0
          }
          gh release delete-asset data cve-all.tar.xz --yes 2>/dev/null || true
          echo "Uploading cve-all.tar.xz"
          gh release upload data release/cve-all.tar.xz --clobber

      - name: Publish the release
        if: steps.changed.outputs.changed_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # If it was created as a draft above, promote it. Idempotent.
          gh release edit data --draft=false || true

      - name: Cleanup
        if: always()
        run: rm -rf release changed.txt /tmp/prev_data /tmp/prev_all.tar.xz
