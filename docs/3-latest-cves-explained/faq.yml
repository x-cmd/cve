id: x-cve-3-latest-cves-explained

<data>:
  - name:
      en: columns
      cn: 字段
    qa:
      - id: cve-col
        question:
          en: What does the CVE column mean?
          cn: CVE 列是什么意思？
        answer:
          en: The full CVE id, e.g. CVE-2026-90616. Click it to go to the NVD detail page for that record (affected versions, references, timeline, ADP containers).
          cn: 完整 CVE id，例如 CVE-2026-90616。点它跳到该记录的 NVD 详情页（影响版本、参考、时间线、ADP 容器）。
        confidence: 9
        reference:
          - docs/3-latest-cves-explained.en.md

      - id: score-col
        question:
          en: What does the Score column mean?
          cn: Score 列是什么意思？
        answer:
          en: Highest CVSS base score across v4.0 → v3.1 → v3.0 → v2.0. Range 0-10. 9+ critical, 7-8.9 high, 4-6.9 medium, 0.1-3.9 low. Blank = no score published (not "low severity").
          cn: v4.0 → v3.1 → v3.0 → v2.0 中最高的 CVSS 基础分。范围 0-10。9+ 严重、7-8.9 高、4-6.9 中、0.1-3.9 低。空白 = 没发布分数（不是「严重度低」）。
        confidence: 9
        reference:
          - docs/3-latest-cves-explained.en.md

      - id: why-blank-score
        question:
          en: Why is the score blank for some CVEs?
          cn: 为什么有些 CVE 的 score 是空的？
        answer:
          en: |
            Blank means MITRE has no published CVSS vector for that record — NOT "low severity". Three common reasons:

              1. Pre-2017 records. CVSS v2.0 only became standard in 2007; many CNAs didn't adopt it consistently for another decade. CVE-1999-0001 through ~CVE-2016-NNNN frequently have empty scores.

              2. Smaller CNAs opt out. The CVE assignment process is free and most CNAs are volunteer-run. Publishing a CVSS vector requires running the calculator on the impact metrics; many smaller CNAs don't bother.

              3. Reserved-but-not-yet-published IDs. When MITRE reserves a block for a CNA, the JSON may exist but lack `containers.cna.metrics[]`. We treat it as scored: 0.

            In `data/cve-YYYY.tsv` these rows have an empty score field; the parser preserves the empty rather than writing 0 or null so you can distinguish "no data" from "low severity". For the latest-10-CVE table an empty score renders as `—`.

            report/cve.report.tsv's Scored column shows how many CVEs in each year have a score at all. Modern years (2024+) are ~98% scored; 2000 is 0/1236 — none of that year's CVEs have scores.

            For prioritization, pair CVSS with EPSS (first.org/epss) and CISA KEV (cisa.gov/known-exploited-vulnerabilities-catalog) — a CVE with no CVSS score but in KEV is still actively exploited in the wild.
          cn: |
            空白代表 MITRE 没发布该记录的 CVSS 向量——不是「严重度低」。三种常见原因：

              1. 2017 年以前的记录。CVSS v2.0 2007 年才成为标准，许多 CNA 又花了十年才稳定采用。CVE-1999-0001 到 ~CVE-2016-NNNN 经常 score 为空。

              2. 较小的 CNA 选择不发。CVE 分配流程免费，绝大多数 CNA 是志愿者运营。发布 CVSS 向量需要算分数；很多小 CNA 不做这步。

              3. 已预留但尚未发布的 id。MITRE 给 CNA 预留一段 id，JSON 文件可能存在但缺 `containers.cna.metrics[]`。我们标为 scored: 0。

            在 `data/cve-YYYY.tsv` 里这些行的 score 字段为空；解析器保留空而非写 0 或 null，方便区分「无数据」和「严重度低」。最新 10 条 CVE 表里空分渲染为 `—`。

            `report/cve.report.tsv` 的 Scored 列展示每年有多少 CVE 有分。2024+ 现代年份约 98% 有分；2000 年 0/1236——那年一条都没有分。

            优先级排定请搭配 EPSS（first.org/epss）+ CISA KEV（cisa.gov/known-exploited-vulnerabilities-catalog）：一条没 CVSS 分但进了 KEV 的 CVE 仍然是野外被利用的活跃漏洞。
        confidence: 9
        reference:
          - docs/3-latest-cves-explained.en.md

      - id: cwe-col-plus
        question:
          en: Why does the CWE column show `(+2)` sometimes?
          cn: CWE 列有时显示 (+2) 是什么意思？
        answer:
          en: The CVE references 3 CWE ids. The first is shown as a link; the count of additional ids is shown as `(+N)` so the column doesn't blow up.
          cn: 该 CVE 引用了 3 个 CWE id。第一个显示为链接；其他几个以 (+N) 形式显示，避免列宽爆炸。
        confidence: 9
        reference:
          - docs/3-latest-cves-explained.en.md

      - id: description-truncated
        question:
          en: The description is truncated — where do I get the full text?
          cn: 描述被截断了——去哪看完整版？
        answer:
          en: Click the CVE id → NVD detail page → "Description" section. Or run `x cve detail CVE-YYYY-NNNN` for the raw upstream JSON.
          cn: 点 CVE id → NVD 详情页 → "Description" 段。或者跑 `x cve detail CVE-YYYY-NNNN` 看上游 JSON。
        confidence: 9
        reference:
          - docs/3-latest-cves-explained.en.md

  - name:
      en: cvss
      cn: CVSS
    qa:
      - id: cvss-versions
        question:
          en: Which CVSS version is used?
          cn: 用哪个 CVSS 版本？
        answer:
          en: Whichever is highest. v4.0 is preferred (current spec, 2023+), v3.1 is current de-facto standard, v3.0 is older v3 variant, v2.0 is legacy. We store the single highest number, not the full vector.
          cn: 哪个最高用哪个。v4.0 优先（当前规范，2023+），v3.1 是当前事实标准，v3.0 是更早的 v3 变体，v2.0 是遗留。我们只存最高的那个分数，不是完整向量。
        confidence: 9
        reference:
          - docs/3-latest-cves-explained.en.md

      - id: blank-cvss-2
        question:
          en: Why is the score blank for some recent CVEs?
          cn: 为什么有些最近的 CVE 分是空的？
        answer:
          en: The CNA never published a CVSS vector for that record. Not "low severity". Old CVEs (1999-2016) and smaller CNAs often leave the field empty.
          cn: 该 CNA 没发布 CVSS 向量。不是「严重度低」。早期 CVE（1999-2016）和较小的 CNA 经常留空。
        confidence: 9
        reference:
          - docs/3-latest-cves-explained.en.md

  - name:
      en: patched
      cn: patched 字段
    qa:
      - id: patched-zero
        question:
          en: If patched is 0, is it unpatched?
          cn: patched 是 0 是不是没修？
        answer:
          en: Not necessarily. Many CNAs publish a fix without populating the structured `solutions[]` field. The maintainer fixed it; MITRE has no machine-readable signal.
          cn: 不一定。很多 CNA 修了但没填这个结构化字段。维护者修了；MITRE 这边没有机器可读信号。
        confidence: 9
        reference:
          - docs/3-latest-cves-explained.en.md

      - id: patched-one
        question:
          en: If patched is 1, am I safe?
          cn: patched 是 1 我就安全了吗？
        answer:
          en: Not necessarily. `patched: 1` only means a fix exists upstream. Whether your pinned dependency version pulls the fix in is a separate question — that's `dependabot` / Renovate / `npm audit fix` territory.
          cn: 不一定。`patched: 1` 只代表上游有修复。你固定的依赖版本是不是拉到这个修复是另一个问题——那是 `dependabot` / Renovate / `npm audit fix` 的活儿。
        confidence: 9
        reference:
          - docs/3-latest-cves-explained.en.md
